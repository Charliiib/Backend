server:
  port: ${PORT:8080}
  connection-timeout: 30000

  tomcat:
    # Timeout de conexión en milisegundos (30 segundos)
    connection-timeout: 30000
    # Tiempo máximo para mantener una conexión alive (puede ayudar)
    keep-alive-timeout: 30000
    # Número máximo de hilos (puede ayudar a manejar múltiples conexiones)
    max-threads: 200
    # Tamaño máximo de la cola de solicitudes
    max-connections: 10000

spring:
  application:
    name: chatbot-backend
  profiles:
    active: prod

  # Configuración de base de datos (comentar si no la usas)
  # datasource:
  #   url: jdbc:postgresql://${DATABASE_URL:localhost:5432/chatbot}
  #   driver-class-name: org.postgresql.Driver
  #   username: ${DATABASE_USERNAME:user}
  #   password: ${DATABASE_PASSWORD:password}

  # Configuración de JPA/Hibernate (simplificada)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# Configuración de JWT (opcional)
jwt:
  secret: ${APP_JWT_SECRET:mySecretKey123}
  expiration: 86400000 # 24 horas

# Configuración CORS para Vercel - CRÍTICO PARA RAILWAY
cors:
  allowed-origins:
    - https://frontend-pi-jet-42.vercel.app
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
    - https://*.vercel.app
    - https://*.vercel.com
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - HEAD
  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Requested-With
    - Access-Control-Request-Method
    - Access-Control-Request-Headers
  exposed-headers:
    - Authorization
    - Content-Type
    - Access-Control-Allow-Origin
  allow-credentials: true
  max-age: 3600

# Configuración de la API de Google Gemini
google:
  ai:
    api:
      # 🔥 CRÍTICO: Variable de entorno OBLIGATORIA para Railway
      # Debes configurar GOOGLE_AI_API_KEY en Railway Dashboard
      key: ${GOOGLE.AI.API.KEY}

# Logging simplificado para Railway
logging:
  level:
    root: INFO
    com.webapp.comparar: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: application.log

# Configuración específica de Railway
railway:
  health:
    check: /actuator/health

# Actuator básico para Railway
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# Configuración de perfiles
---
spring:
  config:
    activate:
      on-profile: dev

  # Base de datos H2 para desarrollo local
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

# Para desarrollo local, API key por defecto (usar tu key real)
google:
  ai:
    api:
      key: ${GOOGLE.AI.API.KEY:AIzaSyB-your-dev-key-here}

logging:
  level:
    root: DEBUG
    com.webapp.comparar: DEBUG