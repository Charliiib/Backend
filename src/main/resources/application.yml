server:
  port: ${PORT:8080}
  connection-timeout: 180000  # 🔥 3 minutos para SSE

  tomcat:
    # Timeout de conexión en milisegundos (3 minutos para SSE)
    connection-timeout: 180000
    # Tiempo máximo para mantener una conexión alive
    keep-alive-timeout: 60000
    # Número máximo de hilos
    max-threads: 200
    # Tamaño máximo de la cola de solicitudes
    max-connections: 10000

spring:
  application:
    name: chatbot-backend
  profiles:
    active: prod

  # Configuración SSE específica
  mvc:
    async:
      request-timeout: 180000  # 🔥 3 minutos

  # Configuración de base de datos (si usas)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# Configuración de JWT
jwt:
  secret: ${APP_JWT_SECRET:mySecretKey123}
  expiration: 86400000 # 24 horas

# 🔥 CONFIGURACIÓN CORS MEJORADA PARA RAILWAY + VERCEL
cors:
  allowed-origins:
    - https://frontend-pi-jet-42.vercel.app
    - https://frontend-git-main-charlis-projects-6b04c52b.vercel.app
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
    - HEAD
  allowed-headers:
    - Authorization
    - Content-Type
    - Accept
    - Origin
    - X-Requested-With
    - Access-Control-Request-Method
    - Access-Control-Request-Headers
    - Last-Event-ID  # 🔥 CRÍTICO para SSE
    - Cache-Control
  exposed-headers:
    - Authorization
    - Content-Type
    - Access-Control-Allow-Origin
    - Last-Event-ID  # 🔥 CRÍTICO para SSE
  allow-credentials: true
  max-age: 3600

# 🔥 CONFIGURACIÓN GOOGLE AI API
google:
  ai:
    api:
      key: ${GOOGLE_AI_API_KEY}  # 🔥 VARIABLE EN RAILWAY

# Logging para Railway
logging:
  level:
    root: INFO
    com.webapp.comparar: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator para Railway
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: dev

  # Configuración desarrollo
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    com.webapp.comparar: DEBUG
    org.springframework.web: DEBUG