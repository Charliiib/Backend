server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

  # Timeouts para Railway
  tomcat:
    connection-timeout: 120000
    keep-alive-timeout: 60000

spring:
  application:
    name: comparar
  profiles:
    active: prod

  # Configuración CORS desde variables de entorno
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://frontend-pi-jet-42.vercel.app,http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,HEAD
    allowed-headers: "*"
    allow-credentials: true

# Configuración Google AI
google:
  ai:
    api:
      key: ${GOOGLE_AI_API_KEY}

# Logging
logging:
  level:
    com.webapp.comparar: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.web.cors: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always