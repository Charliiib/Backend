# Configuración de DESARROLLO - SEGURO para GitHub
spring.datasource.url=jdbc:mysql://localhost:3306/comparar?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.main.lazy-initialization=true

# Logging (útil para debugging)
logging.level.com.webapp.comparar=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG

# Timeout configurations
spring.mvc.async.request-timeout=30000